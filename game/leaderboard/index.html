<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Size It Up Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../game.css">
  <link rel="stylesheet" href="leaderboard.css">
</head>
<body>
  <div class="page">

    <header class="topbar game-topbar">
      <a class="brand" href="../../EEp.html">
        <img src="../../assets/brainmaze-logo.png" alt="The Brain Maze — back to the map">
      </a>
      <a class="btn primary" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        Play
      </a>
    </header>

    <section class="game-hero">
      <div>
        <p class="eyebrow">Size it up</p>
        <h1><span class="title-a">Leader</span> <span class="title-b">board</span></h1>
        <p class="subtitle" id="boardSubtitle">The best 10-round scores, out of 1000 points.</p>
        <span class="mode-badge" id="modeBadge" hidden></span>
      </div>
    </section>

    <p class="board-notice" id="boardNotice" hidden></p>

    <section class="card board">
      <div class="card-head board-head">
        <span>Rank</span>
        <span>Player</span>
        <span class="num">Points</span>
      </div>
      <ol class="board-list" id="boardList"></ol>
      <div class="board-empty" id="boardEmpty" hidden>
        <p>No scores yet. Be the first one up here!</p>
        <a class="btn primary" href="../index.html">Play a game</a>
      </div>
    </section>

    <div class="board-footer">
      <a class="back-link" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to the game
      </a>
      <button class="btn" id="clearBtn" hidden>Clear leaderboard</button>
    </div>

  </div>

  <script src="../scores.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
